# nginx in front of php-fpm (.do/Dockerfile). nginx serves the PWA's files straight from /web, so
# a page load's dozens of ES modules never boot Laravel; PHP sees only /api, the server's pages,
# webhooks and app routes (which answer with index.html). docs/architecture.md, "The system".

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # mime.types already maps .js and .woff2; the manifest's, the TrueType font's and the captions' types are missing
    # from it. The landing film's captions track is text/vtt, as WebVTT asks: Chrome reads it either way, a stricter
    # browser may drop a track served as octet-stream.
    types {
        application/manifest+json webmanifest;
        font/ttf ttf;
        text/vtt vtt;
    }
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    gzip on;
    # Level 6, not nginx's default 1: site.css goes out at 76 KB, not 101, and courses.css at 54, not 76,
    # on every public page's first view (Cloudflare passes our gzip through). Brotli was weighed and left
    # out (docs/decisions.md, 2026-11-08).
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    # The public pages link site.css, courses.css and theme-boot.js as ?v=<content hash>. The build writes this
    # image's exact hashes here ($static_cache, $static_edge; App\Support\Http\StaticVersions): those addresses are
    # kept a year in the browser and at Cloudflare's edge; any other ?v= (an old container asked for a new deploy's
    # hash, a guess) and every file without one revalidates as before.
    include /etc/nginx/static-versions.conf;

    server {
        listen 8080 default_server;
        root /app/server/public;
        index index.php;

        # The security headers on the files nginx serves itself are set in each static location
        # below; Laravel sets them on everything it answers (a server-level add_header here would
        # double them on PHP's responses).

        # The PWA's files always revalidate (a cheap 304 by ETag): a module imported after load, as
        # the admin and Sing are, must never be an older deploy's beside a newer one.
        # Never kept at Cloudflare's edge either: one module from the last deploy beside another
        # from this one breaks the app (no sound until the old copy ages out).
        # The one exception: the public layout's ?v=<this build's hash> files, kept a year (the maps above).
        location ~ ^/(js|engine|css|icons|sounds|templates|locales|course)/ {
            root /app/web;
            etag on;
            add_header Cache-Control $static_cache always;
            add_header Cloudflare-CDN-Cache-Control $static_edge always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # The web fonts (web/fonts, the app's and the site's own since 2026-11-02): kept a week, by the browser and at
        # Cloudflare's edge, as no deploy changes a font under its name (a changed font gets a new file name).
        location ^~ /fonts/ {
            root /app/web;
            etag on;
            add_header Cache-Control "public, max-age=604800" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # The service workers (the app's, and the free tools' own, docs/tools-plan.md) and the manifest
        # always revalidate, in the browser and never kept at Cloudflare's edge: an old worker held
        # anywhere keeps an old version in charge.
        location ~ ^/(sw\.js|tools-sw\.js|manifest\.webmanifest)$ {
            root /app/web;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # The server's own static files (the admin's passkeys script).
        location /assets/ {
            etag on;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only Laravel's front controller runs as PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
