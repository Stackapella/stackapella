# nginx in front of php-fpm (.do/Dockerfile). nginx serves the PWA's files straight from /web, so
# a page load's dozens of ES modules never boot Laravel; PHP sees only /api, the server's pages,
# webhooks and app routes (which answer with index.html). docs/architecture.md, "The system".

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # mime.types already maps .js; only the manifest's type is missing from it.
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080 default_server;
        root /app/server/public;
        index index.php;

        # The security headers on the files nginx serves itself are set in each static location
        # below; Laravel sets them on everything it answers (a server-level add_header here would
        # double them on PHP's responses).

        # The PWA's files always revalidate (a cheap 304 by ETag): a module imported after load, as
        # the admin and Sing are, must never be an older deploy's beside a newer one.
        # Never kept at Cloudflare's edge either: one module from the last deploy beside another
        # from this one breaks the app (no sound until the old copy ages out).
        location ~ ^/(js|engine|css|icons|sounds|templates|locales|course)/ {
            root /app/web;
            etag on;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # The service worker and the manifest always revalidate, in the browser and never kept at
        # Cloudflare's edge: an old worker held anywhere keeps an old version in charge.
        location ~ ^/(sw\.js|manifest\.webmanifest)$ {
            root /app/web;
            add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # The server's own static files (the admin's passkeys script).
        location /assets/ {
            etag on;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Only Laravel's front controller runs as PHP.
        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
