; The php-fpm pool for the web component (loaded after the image's www.conf, so it wins).
;
; Sized for the 1 GB web instance: about 200 MB for the OS, nginx and opcache leaves about 800 MB.
; A typical request here uses 30 to 60 MB, so 12 children is about 720 MB at 60 MB each; the
; 256 MB memory_limit is a ceiling for one bad request, not the average. Change pm.max_children
; with the instance size (roughly (instance MB - 200) / 60).
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; Logs go to stderr with everything else (App Platform collects them).
catch_workers_output = yes
decorate_workers_output = no
