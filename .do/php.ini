; Production PHP settings for every component.
expose_php = Off
memory_limit = 256M
; Audio never passes through PHP (presigned PUTs go straight to Spaces), so request bodies stay small.
post_max_size = 2M
upload_max_filesize = 2M
max_execution_time = 60
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
realpath_cache_size = 4096K
; Exceptions keep no arguments (they can be a person or their words; Sentry never sees them).
zend.exception_ignore_args = On
