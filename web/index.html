<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Vue's host, connected to as the page starts: on a first visit Vue is the last file the app waits for, and its new
         connection was a second and more of that on Slow 4G (2026-11-14). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Harmony, made by you. For one voice, or a whole choir. Learn a part with a guide voice, then stack your own voices, exactly in time.">
    <meta name="theme-color" content="#17120f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stackapella">
    <title>Stackapella</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <!-- Figtree's Latin half, fetched with the page: its other faces (css/input.css) load only when a page uses them. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree-latin.woff2" crossorigin>
    <!-- The chosen theme (light or dark, and a colour), set before the page paints. The app's game mode may be light (the site's never is). -->
    <meta name="stackapella-app" content="1">
    <!-- Game mode's own sheet (docs/css-split-plan.md, step 3): fetched only in game mode (theme-boot.js preloads it) and
         linked right after app.css by js/game-css.js, so serious mode never loads it and game mode never flashes without it. -->
    <meta name="game-css" content="/css/app-game.css">
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/game-css.js"></script>
    <!-- Libraries load from the CDN at a pinned version, refused if their bytes change (SRI). -->
    <script type="importmap">
    {
        "imports": {
            "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.esm-browser.prod.js"
        },
        "integrity": {
            "https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.esm-browser.prod.js": "sha384-Yy+wUwjypE8OL2+tZ7lLLMsIVMFBXibFJCdzCWWWXnuVVdiuS3gViCyubnRyWnSP"
        }
    }
    </script>
    <!-- Loaded only when needed, by js/mp3.js (pinned, with SRI); named here so the CSP allows it:
         https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js
         https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js (js/qr.js, the warm-up's QR code) -->
    <!-- Vue preloaded on a first visit only (with the service worker in control, its cache answers). -->
    <script src="/js/preload.js"></script>
    <!-- A browser too old for the import map (Safari before 16.4): a plain message, not a blank page. -->
    <script src="/js/old-browser.js" defer></script>
    <!-- The app that never starts (its modules unreachable): a calm "couldn't load" with Reload, not a blank page. -->
    <script src="/js/boot-watch.js" defer></script>
    <script type="module" src="/js/main.js"></script>
</head>
<body class="bg-ink font-sans text-cream antialiased">
    <!-- Before the app draws (about 4 s on a slow phone's first visit, docs/agents/handoff-frontend.md): the logo, faded in
         only if the app hasn't drawn within 0.4 s, so a quick load never flashes it. Vue replaces it when it mounts. The mark
         is js/logo-mark.js's (web/tool/icons.py writes that one; tests/app-shell.test.js checks the two match). -->
    <div id="app"><div class="app-splash" aria-hidden="true"><svg width='56' height='56' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='86' fill='#000000'/><rect x='109.00' y='172.00' width='294.00' height='29.40' rx='14.70' fill='#ff9139'/><rect x='109.00' y='218.20' width='217.56' height='29.40' rx='14.70' fill='#ffea6b'/><rect x='109.00' y='264.40' width='258.72' height='29.40' rx='14.70' fill='#45eca4'/><rect x='109.00' y='310.60' width='182.28' height='29.40' rx='14.70' fill='#968dfd'/></svg></div></div>
    <noscript>Stackapella needs JavaScript.</noscript>
</body>
</html>
